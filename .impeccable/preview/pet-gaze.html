<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页伙伴球 看向按钮 + 气泡 预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#CEECF5; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 0 40px; gap:26px; }
  .row { display:flex; gap:28px; align-items:flex-start; }

  /* 1rpx = 1px 的 2x 放大镜像：controlPad 552x444rpx */
  .pad {
    position:relative; width:552px; height:444px;
    display:grid; grid-template-columns:repeat(2,270px); grid-template-rows:repeat(2,214px);
    column-gap:12px; row-gap:16px; justify-content:center; align-content:center;
  }
  .padItem {
    position:relative; width:270px; height:214px; padding:16px; border-radius:28px;
    background:#FFFFFF; border:2px solid rgba(145,206,221,.30);
    box-shadow:0 18px 44px rgba(13,70,92,.11), 0 6px 14px rgba(13,70,92,.05), inset 0 0 0 2px rgba(255,255,255,.95);
    display:flex; overflow:hidden;
    transition:transform .18s ease, box-shadow .28s ease, border-color .28s ease;
  }
  .padTL { grid-column:1; grid-row:1; align-items:flex-start; justify-content:flex-start; }
  .padTR { grid-column:2; grid-row:1; align-items:flex-start; justify-content:flex-end; text-align:right; }
  .padBL { grid-column:1; grid-row:2; align-items:flex-end; justify-content:flex-start; }
  .padBR { grid-column:2; grid-row:2; align-items:flex-end; justify-content:flex-end; text-align:right; }
  .padInk { display:flex; flex-direction:column; gap:6px; }
  .padWord { font-size:30px; font-weight:700; color:#102a43; }
  .padSub { font-size:21px; color:#56748a; }
  .padGlance {
    transform:scale(0.94);
    border-color:rgba(16,42,67,0.38);
    box-shadow:0 8px 22px rgba(13,70,92,0.18), 0 3px 8px rgba(13,70,92,0.08);
  }
  .padPet {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:6;
    width:264px; height:264px; display:flex; align-items:center; justify-content:center; pointer-events:none;
  }
  .petCanvas { width:264px; height:264px; position:relative; z-index:2; }

  /* 气泡：镜像 index.wxss（1rpx=1px） */
  .petBubble {
    position:absolute; left:calc(50% + 112px); bottom:calc(50% + 30px); z-index:8;
    width:max-content; max-width:264px; padding:14px 18px;
    background:rgba(255,255,255,0.97); border:2px solid rgba(145,206,221,0.45);
    border-radius:20px; box-shadow:0 14px 34px rgba(13,70,92,0.14); pointer-events:none;
  }
  .petBubbleTail { position:absolute; left:8px; bottom:-16px; width:0; height:0;
    border-left:12px solid transparent; border-right:12px solid transparent; border-top:16px solid rgba(145,206,221,0.45); }
  .petBubbleTailFill { position:absolute; left:10px; bottom:-12px; width:0; height:0;
    border-left:10px solid transparent; border-right:10px solid transparent; border-top:13px solid rgba(255,255,255,0.97); }
  .petBubbleText {
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
    font-size:22px; font-weight:500; line-height:1.6; color:#102a43; text-align:center; word-break:keep-all;
  }
  .tag { font-size:13px; color:#27466d; font-weight:600; padding:2px 0; }
  .frame { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .frameTitle { font-size:14px; font-weight:700; color:#17364a; }
</style>
</head>
<body>
  <div class="row">
    <div class="frame"><div class="frameTitle">TL 看向设备（按钮被按下示意）</div>
      <div class="pad" id="pad1">
        <div class="padItem padTL" data-pad="tl"><div class="padInk"><div class="padWord">设备</div><div class="padSub">连接水杯</div></div></div>
        <div class="padItem padTR" data-pad="tr"><div class="padInk"><div class="padWord">定位</div><div class="padSub">定位水杯</div></div></div>
        <div class="padItem padBL" data-pad="bl"><div class="padInk"><div class="padWord">智聊</div><div class="padSub">AI 对话</div></div></div>
        <div class="padItem padBR" data-pad="br"><div class="padInk"><div class="padWord">加热</div><div class="padSub">快速热水</div></div></div>
        <div class="padPet"><canvas id="petCanvas1" class="petCanvas"></canvas></div>
      </div>
    </div>
    <div class="frame"><div class="frameTitle">TR 看向定位</div>
      <div class="pad" id="pad2">
        <div class="padItem padTL" data-pad="tl"><div class="padInk"><div class="padWord">设备</div><div class="padSub">连接水杯</div></div></div>
        <div class="padItem padTR" data-pad="tr"><div class="padInk"><div class="padWord">定位</div><div class="padSub">定位水杯</div></div></div>
        <div class="padItem padBL" data-pad="bl"><div class="padInk"><div class="padWord">智聊</div><div class="padSub">AI 对话</div></div></div>
        <div class="padItem padBR" data-pad="br"><div class="padInk"><div class="padWord">加热</div><div class="padSub">快速热水</div></div></div>
        <div class="padPet"><canvas id="petCanvas2" class="petCanvas"></canvas></div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="frame"><div class="frameTitle">BL 看向智聊</div>
      <div class="pad" id="pad3">
        <div class="padItem padTL" data-pad="tl"><div class="padInk"><div class="padWord">设备</div><div class="padSub">连接水杯</div></div></div>
        <div class="padItem padTR" data-pad="tr"><div class="padInk"><div class="padWord">定位</div><div class="padSub">定位水杯</div></div></div>
        <div class="padItem padBL" data-pad="bl"><div class="padInk"><div class="padWord">智聊</div><div class="padSub">AI 对话</div></div></div>
        <div class="padItem padBR" data-pad="br"><div class="padInk"><div class="padWord">加热</div><div class="padSub">快速热水</div></div></div>
        <div class="padPet"><canvas id="petCanvas3" class="petCanvas"></canvas></div>
      </div>
    </div>
    <div class="frame"><div class="frameTitle">BR 看向加热</div>
      <div class="pad" id="pad4">
        <div class="padItem padTL" data-pad="tl"><div class="padInk"><div class="padWord">设备</div><div class="padSub">连接水杯</div></div></div>
        <div class="padItem padTR" data-pad="tr"><div class="padInk"><div class="padWord">定位</div><div class="padSub">定位水杯</div></div></div>
        <div class="padItem padBL" data-pad="bl"><div class="padInk"><div class="padWord">智聊</div><div class="padSub">AI 对话</div></div></div>
        <div class="padItem padBR" data-pad="br"><div class="padInk"><div class="padWord">加热</div><div class="padSub">快速热水</div></div></div>
        <div class="padPet"><canvas id="petCanvas4" class="petCanvas"></canvas></div>
      </div>
    </div>
  </div>
  <div class="frame"><div class="frameTitle">气泡放大后（最长文案 19 字，待机表情）</div>
    <div class="pad" id="pad5">
      <div class="padItem padTL"><div class="padInk"><div class="padWord">设备</div><div class="padSub">连接水杯</div></div></div>
      <div class="padItem padTR"><div class="padInk"><div class="padWord">定位</div><div class="padSub">定位水杯</div></div></div>
      <div class="padItem padBL"><div class="padInk"><div class="padWord">智聊</div><div class="padSub">AI 对话</div></div></div>
      <div class="padItem padBR"><div class="padInk"><div class="padWord">加热</div><div class="padSub">快速热水</div></div></div>
      <div class="padPet">
        <canvas id="petCanvas5" class="petCanvas"></canvas>
        <div class="petBubble"><div class="petBubbleTail"></div><div class="petBubbleTailFill"></div>
          <div class="petBubbleText">达标的感觉，干了这杯…不用了，已经够了</div></div>
      </div>
    </div>
  </div>

<script>
var __registry = {};
function defineModule(name, src) {
  var module = { exports: {} };
  var fn = new Function('require', 'module', 'exports', src);
  fn(function (dep) { return __registry[dep]; }, module, module.exports);
  __registry[name] = module.exports;
}
async function loadAll(list) {
  for (var i = 0; i < list.length; i++) {
    var res = await fetch(list[i][1]);
    defineModule(list[i][0], await res.text());
  }
}
function mount(canvasId, emotionId, highlightSel) {
  var canvas = document.getElementById(canvasId);
  var dpr = 3;
  canvas.width = 264 * dpr; canvas.height = 264 * dpr;
  var ctx = canvas.getContext('2d');
  var eng = __registry['engine'].create({ canvas: canvas, ctx: ctx }, {
    emotion: emotionId, margin: 1.18,
    raf: function (cb) { window.requestAnimationFrame(cb); }
  });
  if (highlightSel) document.querySelector(highlightSel).classList.add('padGlance');
  return eng;
}
(async function () {
  await loadAll([
    ['./rings', '/utils/emotion/rings.js'],
    ['../emotion/rings.js', '/utils/emotion/rings.js'],
    ['./emotions', '/utils/emotion/emotions.js'],
    ['./ball-canvas', '/utils/emotion/ball-canvas.js'],
    ['../pet/glanceEmotions.js', '/utils/pet/glanceEmotions.js'],
    ['engine', '/utils/emotion/engine.js']
  ]);
  mount('petCanvas1', '50', '#pad1 [data-pad="tl"]');
  mount('petCanvas2', '51', '#pad2 [data-pad="tr"]');
  mount('petCanvas3', '52', '#pad3 [data-pad="bl"]');
  mount('petCanvas4', '53', '#pad4 [data-pad="br"]');
  mount('petCanvas5', '02', null);
  window.__petReady = true;
})();
</script>
</body>
</html>
