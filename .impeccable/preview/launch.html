<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>launch preview · 一线水光 · 落水变奏</title>
<style>
    /* 镜像 pages/launch/launch.wxss，rpx→px 按 750 设计稿 → 390px 视口（×0.52） */
    html, body { margin: 0; padding: 0; background: #E8EEF2; }

    .launch {
        position: relative;
        width: 100%;
        height: 100vh;
        box-sizing: border-box;
        overflow: hidden;
        background: linear-gradient(180deg, #F5F8FA 0%, #F7F9FA 26%, #F0F6F9 38%, #E4F0F6 46%, #D8EBF3 58%, #CBE4F0 76%, #BCDDEA 100%);
        opacity: 1;
        transition: opacity 500ms ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .launch.leaving { opacity: 0; }

    .drift {
        position: absolute;
        width: 832px;
        height: 624px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
    }
    .driftA {
        top: -291px;
        left: -239px;
        background: radial-gradient(closest-side, rgba(232,242,248,0.7), rgba(232,242,248,0) 72%);
        animation: fadeIn 1600ms ease 200ms both, driftA 32s ease-in-out 2s infinite alternate;
    }
    .driftB {
        bottom: -343px;
        right: -281px;
        background: radial-gradient(closest-side, rgba(222,242,250,0.95), rgba(222,242,250,0) 72%);
        animation: fadeIn 1600ms ease 400ms both, driftB 26s ease-in-out 2s infinite alternate;
    }
    @keyframes driftA { from { transform: translateX(0); } to { transform: translateX(239px); } }
    @keyframes driftB { from { transform: translateX(0); } to { transform: translateX(-218px); } }

    .swell {
        position: absolute;
        pointer-events: none;
        filter: blur(10px);
        opacity: 0;
        top: 60%;
        left: -30%;
        width: 160%;
        height: 146px;
        background: radial-gradient(50% 60% at 50% 50%, rgba(150,198,221,0.3), rgba(150,198,221,0) 70%);
        animation: fadeIn 2000ms ease 1200ms both, swellDrift 26s ease-in-out 3s infinite alternate;
    }
    .swell2 {
        top: 78%;
        left: -20%;
        width: 150%;
        height: 125px;
        background: radial-gradient(50% 60% at 50% 50%, rgba(140,190,215,0.22), rgba(140,190,215,0) 70%);
        filter: blur(12px);
        animation: fadeIn 2200ms ease 1600ms both, swellDrift2 34s ease-in-out 3s infinite alternate;
    }
    @keyframes swellDrift { from { transform: translateX(-4%); } to { transform: translateX(9%); } }
    @keyframes swellDrift2 { from { transform: translateX(6%); } to { transform: translateX(-7%); } }

    .caustic {
        position: absolute;
        pointer-events: none;
        opacity: 0;
    }
    .caustic.a {
        top: 55%;
        left: 8%;
        width: 156px;
        height: 57px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,255,255,0.5), rgba(255,255,255,0) 70%);
        filter: blur(6px);
        animation: fadeIn 1200ms ease 1400ms both, causticA 19s ease-in-out 2s infinite alternate;
    }
    .caustic.b {
        top: 68%;
        right: 10%;
        width: 125px;
        height: 47px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,255,255,0.42), rgba(255,255,255,0) 70%);
        filter: blur(5px);
        animation: fadeIn 1200ms ease 1700ms both, causticB 23s ease-in-out 2s infinite alternate;
    }
    @keyframes causticA { from { transform: translate(0,0) scale(1); } to { transform: translate(47px, 6px) scale(1.15); } }
    @keyframes causticB { from { transform: translate(0,0) scale(1.08); } to { transform: translate(-42px, -5px) scale(1); } }

    .sheen {
        position: absolute; top: 46%; right: 0; left: 0; height: 83px;
        background: linear-gradient(180deg, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0) 70%);
        pointer-events: none;
        opacity: 0;
        animation: fadeIn 900ms ease 700ms both, sheenLive 7000ms ease-in-out 1600ms infinite alternate;
    }
    @keyframes sheenLive {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0.75; transform: translateY(1px); }
    }

    .horizon { position: absolute; top: 46%; right: 0; left: 0; }
    .lineWrap {
        position: relative; height: 1px;
        transform: scaleX(0);
        animation: lineIn 900ms cubic-bezier(0.22,0.61,0.36,1) 150ms both;
    }
    .line {
        position: absolute; top: 0; right: 0; left: 0; height: 1px;
        background: linear-gradient(90deg,
            rgba(13,138,164,0) 0%,
            rgba(13,138,164,0.22) 14%,
            rgba(13,138,164,0.6) 34%,
            rgba(13,138,164,0.85) 50%,
            rgba(13,138,164,0.6) 66%,
            rgba(13,138,164,0.22) 86%,
            rgba(13,138,164,0) 100%);
        animation: breathe 4200ms ease-in-out infinite alternate;
    }
    .lineShadow {
        position: absolute; top: 3px; right: 0; left: 0; height: 1px;
        filter: blur(1px);
        background: linear-gradient(90deg,
            rgba(13,138,164,0) 0%,
            rgba(13,138,164,0.35) 30%,
            rgba(13,138,164,0.55) 50%,
            rgba(13,138,164,0.35) 70%,
            rgba(13,138,164,0) 100%);
        opacity: 0;
        animation: fadeIn 900ms ease 800ms both;
    }
    .reflection {
        position: absolute; top: 3px; left: 50%;
        width: 8px; height: 125px; margin-left: -4px;
        background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 78%);
        filter: blur(2px);
        transform-origin: 50% 0;
        opacity: 0;
        animation: reflectionIn 800ms ease 1000ms both, reflectionSway 6500ms ease-in-out 1800ms infinite alternate;
    }
    @keyframes reflectionIn { from { opacity: 0; } to { opacity: 0.55; } }
    @keyframes reflectionSway {
        from { transform: rotate(0.5deg); }
        to { transform: rotate(-0.5deg); }
    }
    .glint {
        position: absolute; top: -0.5px; left: 0;
        width: 104px; height: 2px;
        border-radius: 1px;
        filter: blur(1px);
        background: linear-gradient(90deg, rgba(240,252,254,0) 0%, rgba(240,252,254,0.85) 50%, rgba(240,252,254,0) 100%);
        opacity: 0;
        animation: glintIn 900ms ease 1500ms both, glintDrift 14s linear 2400ms infinite;
    }
    .drop {
        position: absolute; top: 50%; left: 50%;
        width: 4px; height: 7px; margin-left: -2px;
        border-radius: 50%;
        background: rgba(23,150,178,0.8);
        opacity: 0;
        animation: dropFall 620ms cubic-bezier(0.55,0.06,0.68,0.19) 1240ms both;
        pointer-events: none;
    }
    @keyframes dropFall {
        0% { opacity: 0; transform: translateY(-187px) scale(0.9, 1.15); }
        10% { opacity: 0.9; }
        92% { opacity: 1; }
        100% { opacity: 0; transform: translateY(0) scale(1.15, 0.8); }
    }

    .ring {
        position: absolute; top: 50%; left: 50%;
        width: 47px; height: 3.5px; margin: -1.75px 0 0 -23.5px;
        background: radial-gradient(closest-side, rgba(15,142,168,0) 52%, rgba(15,142,168,0.6) 72%, rgba(15,142,168,0) 90%);
        opacity: 0;
        pointer-events: none;
    }
    .launch.settled .r1 { animation: ringA 1150ms cubic-bezier(0.16,0.84,0.3,1) both; }
    .launch.settled .r2 { animation: ringB 950ms cubic-bezier(0.16,0.84,0.3,1) 200ms both; }
    .launch.settled .r3 { animation: ringC 820ms cubic-bezier(0.16,0.84,0.3,1) 420ms both; }
    @keyframes ringA {
        0% { opacity: 0; transform: scale(0.25, 0.3); }
        12% { opacity: 0.6; }
        100% { opacity: 0; transform: scale(8.5, 5); }
    }
    @keyframes ringB {
        0% { opacity: 0; transform: scale(0.2, 0.25); }
        14% { opacity: 0.45; }
        100% { opacity: 0; transform: scale(6.5, 4); }
    }
    @keyframes ringC {
        0% { opacity: 0; transform: scale(0.15, 0.2); }
        16% { opacity: 0.32; }
        100% { opacity: 0; transform: scale(4.5, 3); }
    }
    .launch.settled .reflection { animation: reflectionPulse 1200ms ease both, reflectionSway 6500ms ease-in-out infinite alternate; }
    @keyframes reflectionPulse {
        0% { opacity: 0.55; }
        30% { opacity: 0.9; }
        100% { opacity: 0.55; }
    }
    .node {
        position: absolute; top: 50%; left: 50%;
        width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
        border-radius: 50%;
        background: #0F8EA8;
        opacity: 0;
    }
    .launch.settled .node { animation: nodeSpread 520ms cubic-bezier(0.22,0.61,0.36,1) both; }
    @keyframes nodeSpread {
        0% { opacity: 0; transform: scale(1, 1); background: #0F8EA8; }
        12% { opacity: 1; }
        35% { transform: scale(1.5, 0.75); background: #19A8C6; }
        100% { opacity: 1; transform: scale(1, 1); background: #0F8EA8; }
    }

    .brandZone { position: absolute; top: 46%; right: 0; bottom: 0; left: 0; pointer-events: none; }
    .brand {
        position: absolute; right: 0; bottom: calc(100% + 50px); left: 0;
        display: flex; flex-direction: column; align-items: center;
        opacity: 0;
        animation: fadeUp 700ms cubic-bezier(0.22,0.61,0.36,1) 420ms both;
    }
    .brandCn {
        font-size: 29px; font-weight: 500; line-height: 1.2;
        letter-spacing: 11px; text-indent: 11px;
        color: #1C2B33;
    }
    .brandEn {
        margin-top: 10px;
        font-size: 10px; font-weight: 500;
        letter-spacing: 6px; text-indent: 6px;
        color: rgba(28,43,51,0.7);
    }
    .brandMirror {
        position: absolute; top: 2px; right: 0; left: 0;
        display: flex; flex-direction: column; align-items: center;
        opacity: 0;
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 70%);
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 70%);
        animation: mirrorIn 900ms ease 1000ms both;
    }
    @keyframes mirrorIn { from { opacity: 0; } to { opacity: 1; } }
    .mInner { display: flex; flex-direction: column; align-items: center; }
    .mCn, .mEn { transform: scaleY(-1); }
    .mEn {
        font-size: 10px; font-weight: 500;
        letter-spacing: 6px; text-indent: 6px;
        color: rgba(28,43,51,0.14);
    }
    .mCn {
        margin-top: 10px;
        font-size: 29px; font-weight: 500; line-height: 1.2;
        letter-spacing: 11px; text-indent: 11px;
        color: rgba(28,43,51,0.2);
    }
    .launch.settled .mCn { animation: mirrorRipple 900ms cubic-bezier(0.22,0.61,0.36,1) 120ms both; }
    .launch.settled .mEn { animation: mirrorRipple 900ms cubic-bezier(0.22,0.61,0.36,1) 240ms both; }
    @keyframes mirrorRipple {
        0% { transform: scaleY(-1) skewX(0); }
        40% { transform: scaleY(-1.05) skewX(0.8deg); }
        100% { transform: scaleY(-1) skewX(0); }
    }

    .foot {
        position: absolute; right: 0; bottom: calc(env(safe-area-inset-bottom) + 33px); left: 0;
        display: flex; justify-content: center;
        opacity: 0;
        animation: fadeIn 600ms ease 700ms both;
    }
    .tip {
        font-size: 11px; letter-spacing: 1.6px;
        color: #3D5C68;
        min-height: 17px;
        animation: tipIn 380ms ease both;
    }
    .tip.alt { animation-name: tipInAlt; }

    @keyframes lineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes breathe { from { opacity: 0.62; } to { opacity: 1; } }
    @keyframes glintIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes glintDrift {
        0% { transform: translateX(-114px); opacity: 0; }
        10% { opacity: 0.75; }
        50% { opacity: 0.5; }
        90% { opacity: 0.75; }
        100% { transform: translateX(103vw); opacity: 0; }
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tipIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    @keyframes tipInAlt { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="launch" id="launch">
    <div class="drift driftA"></div>
    <div class="drift driftB"></div>
    <div class="swell"></div>
    <div class="swell swell2"></div>
    <div class="caustic a"></div>
    <div class="caustic b"></div>
    <div class="sheen"></div>

    <div class="horizon">
        <div class="lineWrap">
            <div class="line"></div>
            <div class="lineShadow"></div>
            <div class="reflection"></div>
            <div class="glint"></div>
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="drop"></div>
            <div class="node"></div>
        </div>
    </div>

    <div class="brandZone">
        <div class="brand">
            <div class="brandCn">智能水杯</div>
            <div class="brandEn">SMART CUP</div>
        </div>
        <div class="brandMirror">
            <div class="mInner">
                <div class="mEn">SMART CUP</div>
                <div class="mCn">智能水杯</div>
            </div>
        </div>
    </div>

    <div class="foot">
        <div class="tip" id="tip">正在唤醒水杯</div>
    </div>
</div>
<script>
    var TIPS = ["正在唤醒水杯", "连接云端饮水记录"];
    var hold = /[?&]hold=1/.test(location.search);
    setTimeout(function () {
        var el = document.getElementById("tip");
        el.classList.toggle("alt");
        el.textContent = TIPS[1];
    }, 1500);
    setTimeout(function () {
        document.getElementById("launch").classList.add("settled");
        if (!hold) {
            setTimeout(function () {
                document.getElementById("launch").classList.add("leaving");
            }, 680);
        }
    }, 1900);
</script>
</body>
</html>
