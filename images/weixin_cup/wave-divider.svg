<svg xmlns="http://www.w3.org/2000/svg" width="600" height="32" viewBox="0 0 600 32">
  <defs>
    <!-- 三层水体各自向下渐隐，融入页面背景；
         颜色经类名交给 <style>，深色主题下整段换成夜水配色 -->
    <linearGradient id="wBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sBack" stop-opacity="0.5"/>
      <stop offset="1" class="sBack" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sMid" stop-opacity="0.6"/>
      <stop offset="1" class="sMid" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sFront" stop-opacity="0.7"/>
      <stop offset="1" class="sFront" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <style>
    .sBack { stop-color: #cfe9f3; }
    .sMid { stop-color: #aedbe9; }
    .sFront { stop-color: #8ecbe0; }
    .crest { opacity: 1; }
    @media (prefers-color-scheme: dark) {
      .sBack { stop-color: #35809e; }
      .sMid { stop-color: #4794b2; }
      .sFront { stop-color: #5aa9c7; }
      .crest { opacity: 0.45; }
    }
  </style>

  <!-- 后层：长波缓涌（波长150，位移-300=2个周期，无缝循环） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="7.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path fill="url(#wBack)" d="M0 12 Q 37.5 4 75 12 T 150 12 T 225 12 T 300 12 T 375 12 T 450 12 T 525 12 T 600 12 T 675 12 T 750 12 T 825 12 T 900 12 L 900 32 L 0 32 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 中层：中波错相（波长120，位移-240） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1.3;0 0" dur="5.6s" begin="-2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path fill="url(#wMid)" d="M0 16 Q 30 6 60 16 T 120 16 T 180 16 T 240 16 T 300 16 T 360 16 T 420 16 T 480 16 T 540 16 T 600 16 T 660 16 T 720 16 T 780 16 T 840 16 L 840 32 L 0 32 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-240 0" dur="6.4s" begin="-2.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 前层：短波快流 + 白色浪尖高光（波长100，位移-200） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1.6;0 0" dur="4.4s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path fill="url(#wFront)" d="M0 20 Q 25 8 50 20 T 100 20 T 150 20 T 200 20 T 250 20 T 300 20 T 350 20 T 400 20 T 450 20 T 500 20 T 550 20 T 600 20 T 650 20 T 700 20 T 750 20 T 800 20 L 800 32 L 0 32 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-200 0" dur="4.6s" begin="-1.3s" repeatCount="indefinite"/>
    </path>
    <g class="crest">
      <path fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" d="M0 20 Q 25 8 50 20 T 100 20 T 150 20 T 200 20 T 250 20 T 300 20 T 350 20 T 400 20 T 450 20 T 500 20 T 550 20 T 600 20 T 650 20 T 700 20 T 750 20 T 800 20">
        <animateTransform attributeName="transform" type="translate" values="0 0;-200 0" dur="4.6s" begin="-1.3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0.75;0.55" dur="4.4s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </path>
      <!-- 波峰流光：短划高光沿波面缓慢游走（dashoffset 位移 = 整数个虚线周期，循环无缝） -->
      <path fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="26 174" stroke-dashoffset="0" d="M0 20 Q 25 8 50 20 T 100 20 T 150 20 T 200 20 T 250 20 T 300 20 T 350 20 T 400 20 T 450 20 T 500 20 T 550 20 T 600 20 T 650 20 T 700 20 T 750 20 T 800 20">
        <animateTransform attributeName="transform" type="translate" values="0 0;-200 0" dur="4.6s" begin="-1.3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-dashoffset" values="0;-200" dur="6.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 偶发上升的小气泡：稀疏点缀，避免喧宾夺主 -->
  <g fill="#ffffff">
    <circle cx="112" cy="30" r="1.4" opacity="0">
      <animate attributeName="cy" values="30;6" dur="5.5s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" keyTimes="0;0.3;1" dur="5.5s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="438" cy="30" r="1.1" opacity="0">
      <animate attributeName="cy" values="30;8" dur="7.5s" begin="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" keyTimes="0;0.3;1" dur="7.5s" begin="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
