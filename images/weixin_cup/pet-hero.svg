<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="180" viewBox="0 0 240 180">
  <defs>
    <radialGradient id="ball" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f8fcfd"/>
      <stop offset="1" stop-color="#dceef3"/>
    </radialGradient>

    <!-- 拖尾柔化：轻模糊只揉平多层阶梯边缘，保持彩带清晰 -->
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>

    <!-- z=0 分界线 = 投影椭圆长轴：前/后两个半平面裁剪，与引擎按 z 正负拆层一致 -->
    <clipPath id="clipAF"><polygon points="482.5,-77 651.5,285.5 -73.5,623.5 -242.5,261"/></clipPath>
    <clipPath id="clipAB"><polygon points="482.5,-77 313.5,-439.5 -411.5,-101.5 -242.5,261"/></clipPath>
    <clipPath id="clipBF"><polygon points="482.5,261 313.5,623.5 -411.5,285.5 -242.5,-77"/></clipPath>
    <clipPath id="clipBB"><polygon points="482.5,261 -242.5,-77 -73.5,-439.5 651.5,-101.5"/></clipPath>

    <!-- 拖尾 A：12 层嵌套虚线沿闭合轨道滑行（虚线周期=周长，绕接缝无缝），
         头层圆帽、其余平头，宽度/透明度小步递减；高饱和配色 + 轻模糊 = 清晰锥形尾迹 -->
    <g id="trailA" filter="url(#soft)">
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#a8ddc0" stroke-width="2.6" stroke-dasharray="96 194" stroke-dashoffset="96" opacity="0.3">
        <animate attributeName="stroke-dashoffset" values="96;-194" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#a8ddc0;#b9ebd4;#a4efdc;#a8ddc0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#9cdbbd" stroke-width="3" stroke-dasharray="88 202" stroke-dashoffset="88" opacity="0.36">
        <animate attributeName="stroke-dashoffset" values="88;-202" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#9cdbbd;#ade8ce;#98ebd8;#9cdbbd" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#90d9bb" stroke-width="3.4" stroke-dasharray="80 210" stroke-dashoffset="80" opacity="0.43">
        <animate attributeName="stroke-dashoffset" values="80;-210" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#90d9bb;#a1e5c8;#8ce7d4;#90d9bb" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#84d6b9" stroke-width="3.8" stroke-dasharray="71 219" stroke-dashoffset="71" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="71;-219" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#84d6b9;#95e2c2;#80e3d2;#84d6b9" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#78d3b8" stroke-width="4.2" stroke-dasharray="62 228" stroke-dashoffset="62" opacity="0.58">
        <animate attributeName="stroke-dashoffset" values="62;-228" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#78d3b8;#89dfbc;#74dfd0;#78d3b8" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#6cd0b8" stroke-width="4.6" stroke-dasharray="53 237" stroke-dashoffset="53" opacity="0.66">
        <animate attributeName="stroke-dashoffset" values="53;-237" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#6cd0b8;#7ddbb6;#68dbce;#6cd0b8" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#60ccba" stroke-width="5.1" stroke-dasharray="44 246" stroke-dashoffset="44" opacity="0.73">
        <animate attributeName="stroke-dashoffset" values="44;-246" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#60ccba;#71d7b0;#5cd7d2;#60ccba" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#54c8bd" stroke-width="5.6" stroke-dasharray="35 255" stroke-dashoffset="35" opacity="0.8">
        <animate attributeName="stroke-dashoffset" values="35;-255" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#54c8bd;#65d3aa;#50d3d6;#54c8bd" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#48c4c1" stroke-width="6.1" stroke-dasharray="27 263" stroke-dashoffset="27" opacity="0.86">
        <animate attributeName="stroke-dashoffset" values="27;-263" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#48c4c1;#59cfa4;#44cfda;#48c4c1" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#3ec0c6" stroke-width="6.6" stroke-dasharray="20 270" stroke-dashoffset="20" opacity="0.92">
        <animate attributeName="stroke-dashoffset" values="20;-270" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#3ec0c6;#4fcb9e;#3ac9de;#3ec0c6" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#35bad0" stroke-width="7.2" stroke-dasharray="14 276" stroke-dashoffset="14" opacity="0.96">
        <animate attributeName="stroke-dashoffset" values="14;-276" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#35bad0;#46cb98;#31c2e4;#35bad0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 179.8 64.1 A 66 20 -25 1 1 60.2 119.9 A 66 20 -25 1 1 179.8 64.1" fill="none" stroke="#2cb5d8" stroke-width="7.8" stroke-linecap="round" stroke-dasharray="9 281" stroke-dashoffset="9" opacity="1">
        <animate attributeName="stroke-dashoffset" values="9;-281" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#2cb5d8;#3ecb92;#2abdea;#2cb5d8" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 拖尾 B：反向轨道，异向色相漂移 -->
    <g id="trailB" filter="url(#soft)">
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#a9a3dd" stroke-width="2.6" stroke-dasharray="96 196" stroke-dashoffset="96" opacity="0.3">
        <animate attributeName="stroke-dashoffset" values="96;-196" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#a9a3dd;#9fb5e0;#bfa0e0;#a9a3dd" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#b09ade" stroke-width="3" stroke-dasharray="88 204" stroke-dashoffset="88" opacity="0.36">
        <animate attributeName="stroke-dashoffset" values="88;-204" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#b09ade;#a6ace0;#c39ade;#b09ade" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#b996d8" stroke-width="3.4" stroke-dasharray="80 212" stroke-dashoffset="80" opacity="0.43">
        <animate attributeName="stroke-dashoffset" values="80;-212" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#b996d8;#afa2dc;#cc96d6;#b996d8" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#c292d0" stroke-width="3.8" stroke-dasharray="71 221" stroke-dashoffset="71" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="71;-221" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#c292d0;#b89ed6;#d492ca;#c292d0" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#ca8ec8" stroke-width="4.2" stroke-dasharray="62 230" stroke-dashoffset="62" opacity="0.58">
        <animate attributeName="stroke-dashoffset" values="62;-230" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ca8ec8;#c09ace;#dc8ec0;#ca8ec8" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#d28abf" stroke-width="4.6" stroke-dasharray="53 239" stroke-dashoffset="53" opacity="0.66">
        <animate attributeName="stroke-dashoffset" values="53;-239" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#d28abf;#c896c6;#e28ab6;#d28abf" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#d986b5" stroke-width="5.1" stroke-dasharray="44 248" stroke-dashoffset="44" opacity="0.73">
        <animate attributeName="stroke-dashoffset" values="44;-248" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#d986b5;#cf92bc;#e986ac;#d986b5" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#df82aa" stroke-width="5.6" stroke-dasharray="35 257" stroke-dashoffset="35" opacity="0.8">
        <animate attributeName="stroke-dashoffset" values="35;-257" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#df82aa;#d68eb2;#ef82a0;#df82aa" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#e57e9f" stroke-width="6.1" stroke-dasharray="27 265" stroke-dashoffset="27" opacity="0.86">
        <animate attributeName="stroke-dashoffset" values="27;-265" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#e57e9f;#dc8aac;#f47e94;#e57e9f" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#ea7b95" stroke-width="6.6" stroke-dasharray="20 272" stroke-dashoffset="20" opacity="0.92">
        <animate attributeName="stroke-dashoffset" values="20;-272" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ea7b95;#e187a6;#f87a88;#ea7b95" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#ee77a0" stroke-width="7.2" stroke-dasharray="14 278" stroke-dashoffset="14" opacity="0.96">
        <animate attributeName="stroke-dashoffset" values="14;-278" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ee77a0;#e583b0;#fb7590;#ee77a0" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 60.2 64.1 A 66 21 25 1 0 179.8 119.9 A 66 21 25 1 0 60.2 64.1" fill="none" stroke="#f26ba4" stroke-width="7.8" stroke-linecap="round" stroke-dasharray="9 283" stroke-dashoffset="9" opacity="1">
        <animate attributeName="stroke-dashoffset" values="9;-283" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#f26ba4;#f7966a;#d566f2;#f26ba4" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </defs>

  <!-- 背景上升的小气泡（画在球后面） -->
  <g fill="#7cc6d8">
    <circle cx="52" cy="150" r="4" opacity="0">
      <animate attributeName="cy" values="150;24" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="188" cy="150" r="3" opacity="0">
      <animate attributeName="cy" values="150;30" dur="9s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.26;0" dur="9s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="150" r="2.5" opacity="0">
      <animate attributeName="cy" values="150;40" dur="8s" begin="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.22;0" dur="8s" begin="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面柔影：球升起时收窄变浅 -->
  <ellipse cx="120" cy="158" rx="40" ry="8" fill="#8ecbdd" opacity="0.3">
    <animate attributeName="rx" values="40;33;40" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </ellipse>

  <!-- 表情球：整体上下漂浮 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

    <!-- 背层拖尾：只渲染 z<0 的半平面，被球体自然遮挡 -->
    <use xlink:href="#trailA" href="#trailA" clip-path="url(#clipAB)"/>
    <use xlink:href="#trailB" href="#trailB" clip-path="url(#clipBB)"/>

    <circle cx="120" cy="92" r="54" fill="url(#ball)" stroke="#e4f2f6" stroke-width="2"/>

    <!-- 眼睛：周期性眨一下 -->
    <g fill="#1c2f3a">
      <ellipse cx="103" cy="90" rx="5.5" ry="9">
        <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;0.44;0.48;0.52;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="137" cy="90" rx="5.5" ry="9">
        <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;0.44;0.48;0.52;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- 前层拖尾：只渲染 z≥0 的半平面，横掠球身下缘 -->
    <use xlink:href="#trailA" href="#trailA" clip-path="url(#clipAF)"/>
    <use xlink:href="#trailB" href="#trailB" clip-path="url(#clipBF)"/>
  </g>
</svg>
