<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <!--
    架构总览 · 晨光浅水图板
    客户端一层 → 三条下行链路（BLE / 云开发 / LLM 代理）。
    自包含浅色图板，深浅色主题下均为完整一幅；唯一动效是链路虚线的缓慢流注。
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FA"/>
      <stop offset="1" stop-color="#E9F3F7"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F8EA8" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#0F8EA8" stop-opacity="0.72"/>
      <stop offset="0.82" stop-color="#0F8EA8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#0F8EA8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1158" height="578" rx="26" fill="url(#field)" stroke="#0F8EA8" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- ============ 客户端 ============ -->
  <rect x="70" y="48" width="1020" height="252" rx="18" fill="#ffffff" fill-opacity="0.82" stroke="#0F8EA8" stroke-opacity="0.16"/>
  <text x="94" y="88" font-size="20" font-weight="600" fill="#1C2B33">微信小程序客户端</text>
  <text x="94" y="112" font-size="13" fill="rgba(28,43,51,0.62)">原生 WXML / WXSS · webview 渲染 · 自定义 tabBar</text>

  <g font-size="15" font-weight="600" fill="#1C2B33" text-anchor="middle">
    <rect x="94" y="128" width="228" height="58" rx="12" fill="#ffffff" stroke="rgba(15,142,168,0.18)"/>
    <text x="208" y="152">pages/</text>
    <text x="208" y="172" font-size="12" font-weight="400" fill="rgba(28,43,51,0.62)">17 个页面 · 四 tab 入口</text>

    <rect x="342" y="128" width="228" height="58" rx="12" fill="#ffffff" stroke="rgba(15,142,168,0.18)"/>
    <text x="456" y="152">components/pet-ball</text>
    <text x="456" y="172" font-size="12" font-weight="400" fill="rgba(28,43,51,0.62)">首页宠物水球组件</text>

    <rect x="590" y="128" width="228" height="58" rx="12" fill="#ffffff" stroke="rgba(15,142,168,0.18)"/>
    <text x="704" y="152">custom-tab-bar</text>
    <text x="704" y="172" font-size="12" font-weight="400" fill="rgba(28,43,51,0.62)">自定义胶囊底栏</text>

    <rect x="838" y="128" width="228" height="58" rx="12" fill="#ffffff" stroke="rgba(15,142,168,0.18)"/>
    <text x="952" y="152">utils/</text>
    <text x="952" y="172" font-size="12" font-weight="400" fill="rgba(28,43,51,0.62)">ble · emotion · mates · llm</text>
  </g>

  <rect x="94" y="210" width="972" height="56" rx="12" fill="#ffffff" stroke="rgba(15,142,168,0.18)"/>
  <text x="580" y="236" font-size="15" font-weight="600" fill="#1C2B33" text-anchor="middle">app.js · app.json</text>
  <text x="580" y="256" font-size="12" fill="rgba(28,43,51,0.62)" text-anchor="middle">云环境初始化 · 全局状态 · 提醒调度</text>

  <!-- ============ 三条链路 ============ -->
  <g stroke="url(#flow)" stroke-width="2" stroke-dasharray="5 9" fill="none">
    <line x1="220" y1="306" x2="220" y2="396">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="575" y1="306" x2="575" y2="396">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="930" y1="306" x2="930" y2="396">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#0F8EA8" fill-opacity="0.55">
    <circle cx="220" cy="308" r="3"/><circle cx="575" cy="308" r="3"/><circle cx="930" cy="308" r="3"/>
  </g>
  <g font-size="13" fill="rgba(28,43,51,0.68)">
    <text x="234" y="356">BLE 协议</text>
    <text x="589" y="356">wx.cloud</text>
    <text x="944" y="356">HTTPS · 云函数代理</text>
  </g>

  <!-- ============ 外部三层 ============ -->
  <g text-anchor="middle">
    <rect x="70" y="400" width="300" height="150" rx="18" fill="#ffffff" fill-opacity="0.82" stroke="#0F8EA8" stroke-opacity="0.16"/>
    <text x="220" y="432" font-size="17" font-weight="600" fill="#1C2B33">智能水杯 · BLE</text>
    <g font-size="12.5" fill="rgba(28,43,51,0.68)" font-family="'SF Mono',Consolas,'Courier New',monospace">
      <text x="220" y="458">FFF0 Service · FFF1 Notify</text>
      <text x="220" y="478">FFF2 Write · FFF3 Info</text>
    </g>
    <text x="220" y="504" font-size="12" fill="rgba(28,43,51,0.62)">水量 / 水温 / TDS 实时上报</text>
    <text x="220" y="524" font-size="12" fill="rgba(28,43,51,0.62)">写入唤醒 · 清零指令</text>

    <rect x="425" y="400" width="300" height="150" rx="18" fill="#ffffff" fill-opacity="0.82" stroke="#0F8EA8" stroke-opacity="0.16"/>
    <text x="575" y="432" font-size="17" font-weight="600" fill="#1C2B33">微信云开发</text>
    <text x="575" y="458" font-size="12.5" fill="rgba(28,43,51,0.68)">7 个云函数 · CloudDB · Storage</text>
    <text x="575" y="482" font-size="12" fill="rgba(28,43,51,0.62)">bindCup · drinkRecord · familyCare</text>
    <text x="575" y="502" font-size="12" fill="rgba(28,43,51,0.62)">gpsLatest · hydrationAdvice</text>
    <text x="575" y="522" font-size="12" fill="rgba(28,43,51,0.62)">llmProxy · mapProxy</text>

    <rect x="780" y="400" width="300" height="150" rx="18" fill="#ffffff" fill-opacity="0.82" stroke="#0F8EA8" stroke-opacity="0.16"/>
    <text x="930" y="432" font-size="17" font-weight="600" fill="#1C2B33">LLM API</text>
    <text x="930" y="458" font-size="12.5" fill="rgba(28,43,51,0.68)">OpenAI 兼容接口 · 默认 DeepSeek</text>
    <text x="930" y="482" font-size="12" fill="rgba(28,43,51,0.62)">经 llmProxy 云函数代理调用</text>
    <text x="930" y="502" font-size="12" fill="rgba(28,43,51,0.62)">客户端不直连、不落 Key</text>
    <text x="930" y="522" font-size="12" fill="rgba(28,43,51,0.62)">回复附健康提示</text>
  </g>
</svg>
